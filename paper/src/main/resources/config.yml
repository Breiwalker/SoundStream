# Files are addressed relative to this directory, for example music/theme.ogg.
# Only .ogg (Vorbis) and .mp3 files are accepted. Absolute paths and traversal are rejected.
sounds-directory: sounds

# Maximum size of one source file.
# Up to 1073741824 (1 GiB) is accepted. Files are streamed from disk, so this
# limit does not increase the plugin's memory use.
max-file-bytes: 1073741824

# Per-player limits. The client's advertised limits are also enforced.
max-streams-per-player: 4
# Encoded bytes buffered per stream on the client. The server sends no more
# than this until the client grants CREDIT as playback consumes data.
window-bytes: 4194304
chunk-bytes: 32768
# Maximum encoded bytes sent per stream per server tick.
send-bytes-per-tick: 1048576

# Used by the /soundstream play command unless overridden.
default-volume: 1.0
default-range: 32.0

# Action bar shown to players who do not have the Fabric client mod.
# Set missing-client-actionbar to false to disable it.
# Legacy color codes using & are supported.
missing-client-actionbar: true
missing-client-message: "&eYou currently dont have SoundStream installed, means you cant hear the special music/sounds!"
# Grace period before the join check so a modded client can finish its handshake.
missing-client-delay-ticks: 60
